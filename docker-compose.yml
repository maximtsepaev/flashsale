services:
  postgres:
    image: postgres:15-alpine
    container_name: flashsale_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: flashsale_kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REREPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    restart: unless-stopped

  inventory:
    build:
      context: .
      dockerfile: cmd/inventory/Dockerfile
    container_name: flashsale_inventory
    environment:
      - GRPC_PORT=${GRPC_PORT:-50051}
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "${GRPC_PORT:-50051}:${GRPC_PORT:-50051}"
    depends_on:
      - postgres
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: cmd/gateway/Dockerfile
    container_name: flashsale_gateway
    environment:
      - HTTP_PORT=${HTTP_PORT:-8080}
      - DATABASE_URL=${DATABASE_URL}
      - INVENTORY_GRPC_URL=${INVENTORY_GRPC_URL:-inventory:50051}
      - KAFKA_BROKER=${KAFKA_BROKER:-kafka:29092}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    depends_on:
      - postgres
      - kafka
      - inventory
    restart: unless-stopped

  order:
    build:
      context: .
      dockerfile: cmd/order/Dockerfile
    container_name: flashsale_order
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - KAFKA_BROKER=${KAFKA_BROKER:-kafka:29092}
    depends_on:
      - postgres
      - kafka
    restart: unless-stopped

volumes:
  pgdata: