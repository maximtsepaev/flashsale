version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: flashsale_postgres
    environment:
      - POSTGRES_USER=flashsale
      - POSTGRES_PASSWORD=super_seccret_flash_sale_password
      - POSTGRES_DB=flashsale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: