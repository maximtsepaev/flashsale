version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: flashsale_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super_secret_password
      POSTGRES_DB: flashsale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile 
    container_name: flashsale_gateway
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:super_secret_password@postgres:5432/flashsale?sslmode=disable
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata: